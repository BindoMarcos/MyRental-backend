
services:
  backend:
    build: .
    container_name: backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules 
    env_file:
      - /.env
    depends_on:
      - database

  frontend:
    build:
      context: ../../../../../Users\bindo\Escritorio\MyRental
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    depends_on:
      - backend

  database:
    image: postgres:14-alpine
    container_name: database
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: