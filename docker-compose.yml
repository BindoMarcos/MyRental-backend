
services:
  backend:
    build: .
    container_name: backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules 
    env_file:
      - /.env
    depends_on:
      - database

  database:
    image: postgres:14-alpine
    container_name: database
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: